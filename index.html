    <meta property="og:description"
        content="Architecture students at California College of the Arts are challenged to be creative and visionary. Across four academic programs and five research and teaching labs, they design with aesthetic, social, and environmental issues in mind, producing work that links image to identity, form to performance, and order to equity. We believe that architecture and interior design are critical cultural practices that can and should serve the common good. Architecture at CCA is an arena for the free and open exchange of ideas about the future—of our buildings, cities, and planet—and a laboratory where these ideas are tested through speculative architectural research. Our students challenge conventional ideas at every turn in an innovative culture of making that weds discipline-specific skills and knowledge to emerging technical and conceptual methods." />
